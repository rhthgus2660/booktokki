<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>북토끼</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="북토끼">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#171717}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-muted:#F7F7F7;
    --ink:#171717;
    --ink-soft:#737373;
    --ink-faint:#909090;
    --border:#E9E9E9;
    --accent:#D97D74;
    --accent-soft:#F6DCDA;
    --track:#EEEEEE;
    --fill:#171717;
    --success:#3E7A52;
    --success-soft:#DEEBE1;
    --danger:#B8483A;
    --danger-soft:#F5DEDA;
    --cover-1:#E7B8AE; --cover-2:#AFC3A0; --cover-3:#A6BED2; --cover-4:#D9C093; --cover-5:#C1AAC5;
    --shelf-plank:#D8C7A0;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    margin:0;
    padding-block:28px 64px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea{ font-family:inherit; }
  h1,h2,h3,p{ margin:0; text-wrap:balance; }

  .app{
    max-width:428px;
    margin:0 auto;
    padding-inline:16px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* ---------- auth gate ---------- */
  .auth-gate{
    width:min(100% - 32px,396px); min-height:calc(100vh - 92px); margin:0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 18px; text-align:center;
  }
  .auth-gate img{ width:92px; height:72px; object-fit:contain; image-rendering:pixelated; }
  .auth-gate h1{ margin-top:22px; color:#171717; font-size:1.35rem; font-weight:700; letter-spacing:.04em; }
  .auth-gate-copy{ margin-top:8px; color:#737373; font-size:.78rem; line-height:1.6; }
  .auth-kakao{
    width:100%; min-height:48px; margin-top:30px; border:0; border-radius:4px;
    background:#fee500; color:#191919; font-size:.88rem; font-weight:600; cursor:pointer;
  }
  .auth-kakao:disabled{ opacity:.5; cursor:default; }
  .auth-status{ min-height:20px; margin-top:12px; color:#737373; font-size:.72rem; line-height:1.5; }
  .auth-owner-recovery{ width:100%; margin-top:26px; }
  .auth-owner-recovery strong{ display:block; color:#171717; font-size:.88rem; font-weight:600; line-height:1.55; }
  .auth-owner-recovery p{ margin-top:7px; color:#737373; font-size:.76rem; line-height:1.65; }
  .auth-owner-recovery-action{
    width:100%; min-height:48px; margin-top:24px; border:1px solid #171717; border-radius:4px;
    background:#171717; color:#fff; font-size:.82rem; font-weight:600; cursor:pointer;
  }
  .auth-owner-recovery-action:disabled{ opacity:.5; cursor:default; }
  .auth-owner-recovery-flow{ width:100%; margin-top:22px; border-top:1px solid #e9e9e9; padding-top:22px; text-align:left; }
  .auth-owner-recovery-flow button{ width:100%; min-height:48px; border:1px solid #171717; border-radius:4px; background:#171717; color:#fff; font-size:.82rem; font-weight:600; cursor:pointer; }
  .auth-owner-recovery-flow button:disabled{ opacity:.5; cursor:default; }
  .auth-owner-recovery-flow label{ display:block; margin-top:18px; color:#656565; font-size:.74rem; line-height:1.6; }
  .auth-owner-recovery-flow input[type="file"]{ display:block; width:100%; margin-top:10px; padding:10px; border:1px solid #e9e9e9; border-radius:4px; background:#fff; color:#656565; font-size:.72rem; }
  .auth-owner-recovery-flow label:has(input[type="checkbox"]){ display:flex; align-items:flex-start; gap:8px; }
  .auth-owner-recovery-flow input[type="checkbox"]{ flex:none; width:18px; height:18px; margin:2px 0 0; }
  .auth-owner-recovery-flow p{ min-height:20px; margin-top:12px; }
  .auth-logout{
    min-height:38px; padding:0 4px; border:0; background:none; color:#909090;
    font-size:.68rem; font-weight:400; cursor:pointer;
  }
  .auth-logout:hover{ color:#171717; }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  /* 통계 화면의 실제 제목(.stats-title)이 가장 뚜렷한 hierarchy를 가지려면
     이 앱 전역 헤더부터 한 단계 낮춰야 함 - 모든 화면에 공통으로 걸리는
     라벨이라 원래도 톤을 낮춰 두는 편이 화면별 제목과의 위계에 맞음. */
  .topbar h1{ font-size:.92rem; font-weight:700; letter-spacing:.01em; color:var(--ink-faint); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .icon-nav-btn{
    flex:none;
    width:38px; height:38px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-nav-btn:hover{ border-color:var(--ink-faint); }
  .icon-nav-btn svg{ width:19px; height:19px; }
  .back-btn{
    flex:none;
    width:34px; height:34px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--ink-faint); }
  .sub-topbar{ display:flex; align-items:center; gap:10px; }
  .sub-topbar h2{ font-size:1.05rem; font-weight:900; }

  .offline-pill{
    font-size:.72rem;
    color:var(--ink-soft);
    background:var(--surface-muted);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px 10px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    width:fit-content;
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
  }

  /* bunny hero — the home screen's centerpiece: the burrow the rabbit
     lives in, not a status card about it */
  .bunny-hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:22px 18px 18px;
    background:radial-gradient(ellipse 90% 70% at 50% 100%, var(--surface-muted) 0%, var(--surface) 72%);
  }
  .speech-bubble{
    position:relative;
    background:var(--surface-muted);
    border:1.5px solid var(--border);
    border-radius:18px;
    padding:13px 16px;
    font-size:1rem;
    font-weight:800;
    line-height:1.35;
    max-width:260px;
  }
  .speech-bubble::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-8px;
    width:14px;
    height:14px;
    margin-left:-7px;
    background:var(--surface-muted);
    border-right:1.5px solid var(--border);
    border-bottom:1.5px solid var(--border);
    transform:rotate(45deg);
  }
  .bunny-figure{
    position:relative;
    margin-top:10px;
    width:230px;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Character Master 이미지 에셋 - 원본 비율 그대로, .bunny-figure 박스
     안에 맞춰 표시(contain)만 하고 늘리거나 자르지 않음. 다운스케일이라
     image-rendering은 기본값(부드러운 스케일)을 그대로 둠. */
  /* 카드/박스 크기는 그대로 두고 이미지 표시 크기만 최초 대비 약 47%로 줄여서
     넓은 여백 안에 작은 캐릭터가 혼자 있는 듯한 존재감을 냄
     (1차 68% → 2차로 그 70% 수준까지 추가 축소, 목표 범위 최초의 45~50%) */
  .bunny-img{ max-width:47%; max-height:47%; width:auto; height:auto; display:block; }
  /* 완독 축하 팝업 전용 이미지(Character Master 완독 포즈). 홈 토끼처럼
     박스 안을 꽉 채우지 않고 여백 안에 작게 행동하는 느낌을 유지하되,
     한 번성 축하 모먼트라 홈(47%)보다는 조금 더 뚜렷하게 보이도록 함.
     박스 크기(184x226)는 기존 SVG와 동일하게 유지해 팝업 레이아웃은 그대로. */
  .bunny-done-img{ max-width:60%; max-height:60%; width:auto; height:auto; display:block; }
  .pixel-bunny rect, .pixel-bunny path{ stroke:#2A2018; stroke-width:1; stroke-linejoin:miter; }
  .pixel-bunny .fur{ fill:#FFFBF3; }
  .pixel-bunny .ear-inner{ fill:#F0B7B2; }
  .bunny-caption{
    font-size:.78rem;
    color:var(--ink-faint);
    font-weight:700;
    margin-top:-4px;
  }
  .zzz{
    position:absolute;
    top:34px;
    left:100px;
    font-weight:900;
    color:var(--ink-faint);
    pointer-events:none;
  }
  .zzz span{ position:absolute; }
  .zzz .z1{ font-size:1.2rem; top:0; left:0; }
  .zzz .z2{ font-size:.92rem; top:14px; left:11px; opacity:.8; }
  .zzz .z3{ font-size:.7rem; top:25px; left:19px; opacity:.6; }

  .bunny-status{ font-size:.86rem; color:var(--ink-soft); font-weight:700; line-height:1.6; margin-top:8px; }

  /* small secondary stat line — no longer the home's headline number */
  .stat-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:.78rem;
    color:var(--ink-faint);
    font-weight:700;
    background:none;
    border:none;
    padding:2px 4px;
    cursor:pointer;
    font-variant-numeric:tabular-nums;
    margin:0 auto;
  }
  .stat-line:hover{ color:var(--ink-soft); }
  .stat-line b{ color:var(--ink-soft); font-weight:800; }

  /* section title */
  .section-title{ font-size:1rem; font-weight:900; padding-inline:2px; }

  /* ---------- stats screen ---------- */
  /* 기능 배치가 아니라 제품의 한 화면처럼 보이도록 이 화면만의 타입 스케일을
     둠: 화면 제목(.stats-title) > 소제목(.stats-heading, "9월"/날짜 라벨용,
     둘이 동일한 스타일) > 본문. 전역 h2(.sub-topbar h2)보다 명확히 크게 잡아
     이 화면의 실제 제목이라는 게 한눈에 드러나게 함. */
  .sub-topbar h2.stats-title{ font-size:1.4rem; font-weight:800; letter-spacing:-0.01em; color:var(--ink); }
  .stats-heading{ font-size:.84rem; font-weight:700; color:var(--ink-soft); padding-inline:2px; }

  /* 큰 KPI 카드 대신, 얇은 구분선으로만 나뉘는 배경 위 요약 스트립.
     라벨(작고 옅은 색)과 값(크고 진한 색·굵게)의 대비를 분명히 줘서
     숫자와 설명이 붙어 보이던 문제를 해결함. */
  .stats-summary{ display:grid; grid-template-columns:repeat(4, 1fr); }
  .stats-summary-item{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:0 12px;
    border-right:1px solid var(--border);
  }
  .stats-summary-item:first-child{ padding-left:2px; }
  .stats-summary-item:last-child{ padding-right:0; border-right:none; }
  .stats-summary-label{ font-size:.7rem; font-weight:600; color:var(--ink-faint); letter-spacing:.01em; }
  .stats-summary-value{ font-size:1.05rem; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }

  .stats-day-card{ padding:2px 14px; border-radius:14px; }
  .stats-day-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 4px;
    margin-inline:-4px;
    border-radius:8px;
    cursor:pointer;
    transition:background-color .12s ease;
  }
  .stats-day-row:hover{ background:var(--surface-muted); }
  .stats-day-label{ font-size:.86rem; color:var(--ink); font-weight:600; }
  .stats-day-pages{ font-size:.8rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; font-weight:600; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  /* 달력 카드가 무겁게 느껴진다는 피드백 → radius를 카드 기본값(20px)보다
     한 단계 낮추고 padding도 더 줄임. 날짜 숫자 크기·선택 로직은 그대로. */
  .cal-card{ padding:12px 14px; border-radius:14px; }
  .cal-grid.cal-days-grid{ row-gap:2px; column-gap:3px; }
  .cal-weekdays-row{ margin-bottom:4px; }
  .cal-weekday{ text-align:center; font-size:.7rem; font-weight:700; color:var(--ink-faint); padding-bottom:2px; }
  .cal-day{
    position:relative;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    background:none;
    border:1.5px solid transparent;
    border-radius:9px;
    font-size:.82rem;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .cal-day:hover{ border-color:var(--border); }
  .cal-day.cal-empty{ cursor:default; pointer-events:none; }
  .cal-day.cal-today{ border-color:var(--accent); color:var(--accent); }
  /* 선택 표시를 셀 전체를 채우던 방식에서 margin으로 살짝 인셋된, 더 작고
     정제된 사각형으로 조정(터치 영역은 여전히 40px대 유지). */
  .cal-day.cal-selected{ background:var(--ink); color:var(--surface); border-color:var(--ink); margin:2px; border-radius:6px; }
  .cal-dot{
    position:absolute;
    bottom:5px;
    left:50%;
    width:4px; height:4px;
    margin-left:-2px;
    border-radius:50%;
    background:var(--accent);
  }
  .cal-day.cal-selected .cal-dot{ background:var(--surface); }

  .cover{
    flex:none;
    width:56px;
    height:78px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:1.3rem;
    color:rgba(0,0,0,.55);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .cover.empty{ background:var(--surface-muted); color:var(--ink-faint); font-size:.72rem; font-weight:700; }
  .cover.cover-img{ background:var(--surface-muted); }
  .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cover-link-btn{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:.68rem;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .cover-link-btn:hover{ color:var(--ink); }
  .book-meta{ min-width:0; flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .book-title{ font-size:1.02rem; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-author{ font-size:.82rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-pages{ font-size:.78rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; margin-top:2px; }
  .page-inline-input{
    width:56px;
    font-size:.9rem;
    font-weight:800;
    color:var(--ink);
    background:var(--surface-muted);
    border:1.5px solid var(--border);
    border-radius:9px;
    padding:4px 6px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .page-inline-input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }

  /* A passing character, without a notification panel or interaction. */
  .rabbit-event{
    position:fixed;
    top:calc(72px + env(safe-area-inset-top, 0px));
    left:50%;
    width:calc(100% - 32px);
    max-width:340px;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    gap:8px;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:40;
  }
  .rabbit-event img{ width:56px; height:56px; object-fit:contain; flex:none; }
  .rabbit-event .speech-bubble{ font-size:.84rem; padding:10px 13px; margin-bottom:12px; }
  .rabbit-event .speech-bubble::before{ left:18px; }
  .rabbit-event.is-reacting{ animation:rabbit-visit 4s ease both; }
  @keyframes rabbit-visit{
    0%{ opacity:0; }
    6%,90%{ opacity:1; }
    100%{ opacity:0; }
  }
  @media (prefers-reduced-motion:no-preference){
    .rabbit-event img{ animation:rabbit-peek .25s ease-out both; }
    @keyframes rabbit-peek{ from{ transform:translateY(8px); } to{ transform:translateY(0); } }
  }

  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-track{
    flex:1;
    height:9px;
    border-radius:999px;
    background:var(--track);
    overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--fill); border-radius:999px; }
  .progress-pct{ font-size:.78rem; font-weight:800; font-variant-numeric:tabular-nums; width:36px; text-align:right; }

  .btn-row{ display:flex; gap:8px; }
  .btn{
    border-radius:12px;
    border:1.5px solid transparent;
    font-weight:800;
    font-size:.88rem;
    padding:11px 14px;
    cursor:pointer;
    flex:1;
    text-align:center;
  }
  .btn-dark{ background:var(--fill); color:var(--bg); }
  .btn-dark:hover{ opacity:.9; }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--ink-faint); }
  .btn-danger-outline{ background:var(--surface); border-color:var(--danger-soft); color:var(--danger); }
  .btn-dashed{
    border:1.5px dashed var(--ink-faint);
    background:transparent;
    color:var(--ink-soft);
    border-radius:16px;
    padding:14px;
    font-weight:800;
    font-size:.92rem;
    cursor:pointer;
    width:100%;
  }
  .btn-dashed:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .btn-small{ flex:none; padding:7px 12px; font-size:.78rem; border-radius:10px; }

  .empty-state{
    text-align:center;
    padding:22px 10px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .empty-state p{ font-size:.88rem; color:var(--ink-soft); font-weight:600; }

  /* bookshelf — books stand on shelves in the order they were added,
     each new one taking its place at the end, so filling the shelf
     row by row IS the reading history. */
  .shelf-row{
    display:flex;
    align-items:flex-end;
    gap:9px;
    padding:10px 4px 12px;
    border-bottom:6px solid var(--shelf-plank);
    border-radius:2px;
    box-shadow:0 6px 7px -6px rgba(0,0,0,.22);
  }
  .spine-wrap{ position:relative; flex:none; }
  .spine{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    height:104px;
    padding:0;
    margin:0;
    border-radius:6px 6px 3px 3px;
    border:1px solid var(--border);
    background:var(--surface-muted);
    overflow:hidden;
    cursor:pointer;
    position:relative;
    font:inherit;
  }
  .spine img{ width:100%; height:100%; object-fit:cover; display:block; }
  .spine-label{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-size:.72rem;
    font-weight:800;
    color:var(--ink);
    opacity:.8;
    padding:8px 0;

<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  var state = {
    books: {},
    view: "home",
    selectedBookId: null,
    detailFrom: "library", /* which screen "back" from the detail view returns to */
    editingNoteId: null, /* which 북로그 is currently in its inline edit mode, if any */
    noteComposerOpenBookId: null,
    noteComposeDrafts: {},
    completionReflectionOpenBookId: null,
    completionReflectionDrafts: {},
    statsArchivePanel: null,
    statsFrom: "home",
    statsSelectedDate: null, /* selected day (YYYY-MM-DD) on the 통계 calendar; null = today */
    statsMonth: null, /* selected stats month (YYYY-MM); null = current month */
    feedbackFrom: "my",
    feedbackDraft: "",
    feedbackStatus: null,
    feedbackSubmitting: false,
    dbMode: null /* 'db' | 'local' */
  };
  var db = null;
  var localImages = null;
  var storageReady = null;
  var localSeq = 0;
  var supabaseClient = null;
  var cloudRepository = null;
  var analyticsRepository = null;
  var profileRepository = null;
  var feedbackRepository = null;
  var cloudMutationQueues = {};
  var pendingBookCreates = {};
  var appStarted = false;
  var bootstrapStarted = false;
  var bootstrapPromise = null;
  var bootstrappedUserId = null;
  var activeAuthUserId = null;
  var activeAuthUser = null;
  /* Set after the Worker is deployed. This URL is public configuration;
     the Kakao key remains a Worker secret and is never shipped here. */
  var BOOK_SEARCH_ENDPOINT = "https://booktokki-search.rhthgus2660.workers.dev/books";
  var BOOKTOKKI_GUIDE_URL = "https://desert-sandwich-d38.notion.site/3e882ff9dce98105ab80f0dc599218a4?pvs=73";
  var FEEDBACK_PROMPT_FLAG_PREFIX = "booktokki:feedback-prompt:v1:";
  var MY_RABBIT_ASSET = "assets/bunny-sleep.png";
  document.getElementById("myNavRabbit").src = MY_RABBIT_ASSET;

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    localSeq += 1;
    return "id_" + Date.now() + "_" + localSeq;
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function nowIso(){ return new Date().toISOString(); }
  function fmtMonthDay(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return (d.getMonth()+1) + "." + d.getDate();
  }
  function pct(cur, total){
    if(!total || total<=0) return 0;
    return Math.max(0, Math.min(100, Math.round((cur/total)*100)));
  }
  var COVER_COLORS = ["var(--cover-1)","var(--cover-2)","var(--cover-3)","var(--cover-4)","var(--cover-5)"];
  function coverColor(id){
    var h = 0;
    for (var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return COVER_COLORS[h % COVER_COLORS.length];
  }

  function getBooks(){
    return Object.keys(state.books).map(function(k){ return state.books[k]; });
  }
  function getCurrentReadingBook(){
    var reading = getBooks().filter(function(b){ return b.status === "reading"; });
    reading.sort(function(a,b){ return new Date(b.updatedAt) - new Date(a.updatedAt); });
    return reading[0] || null;
  }

  // Home-only: actual positive page history first, then unstarted books.
  // No age cutoff in v0.4; the meaning of "recent" remains a validation topic.
  function getRecentReadingBooks(){
    var started = [];
    var unstarted = [];
    function createdTime(book){ return Date.parse(book.createdAt) || 0; }
    function stableOrder(a, b){
      return createdTime(b) - createdTime(a) || (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
    }
    getBooks().forEach(function(book){
      if (book.status === "done") return;
      var hasPositive = false;
      var latest = -Infinity;
      (book.pageLogs || []).forEach(function(log){
        if (!(log.delta > 0)) return;
        hasPositive = true;
        var time = Date.parse(log.at);
        if (Number.isFinite(time)) latest = Math.max(latest, time);
      });
      if (latest !== -Infinity) started.push({ book:book, time:latest });
      else if (!hasPositive && book.status === "toread") unstarted.push(book);
    });
    started.sort(function(a, b){ return b.time - a.time || stableOrder(a.book, b.book); });
    unstarted.sort(stableOrder);
    return started.map(function(entry){ return entry.book; }).concat(unstarted).slice(0, 3);
  }
  /* "오늘 기록"은 오직 페이지 기록(logPage/완독 처리) 여부로만 판단한다.
     책 등록이나 메모 작성은 이 값을 건드리지 않는다. */
  function hasLoggedToday(){
    var t = todayStr();
    return getBooks().some(function(b){ return b.lastPageLogDate === t; });
  }
  function todayPagesRead(){
    var t = todayStr();
    var total = 0;
    getBooks().forEach(function(b){
      if (b.lastPageLogDate === t && typeof b.dayStartPage === "number"){
        var delta = b.currentPage - b.dayStartPage;
        if (delta > 0) total += delta;
      }
    });
    return total;
  }
  function countCompletedThisYear(){
    var y = new Date().getFullYear();
    return getBooks().filter(function(b){
      return b.status === "done" && b.completedAt && new Date(b.completedAt).getFullYear() === y;
    }).length;
  }
  function countCompletedThisMonth(){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth();
    return getBooks().filter(function(b){
      if (b.status !== "done" || !b.completedAt) return false;
      var d = new Date(b.completedAt);
      return d.getFullYear() === y && d.getMonth() === m;
    }).length;
  }

  /* ---------------- stats (read-only derived values) ----------------
     Every function below only READS b.pageLogs (already written by
     buildPageLogPatch for every real page change, completion included)
     and never touches state.books or triggers a write. Nothing here can
     affect page-record/completion/bunny logic. */
  function dateKey(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  /* Per-book net page movement for one calendar day, clamped at 0 per
     book - matches todayPagesRead()'s existing rule exactly (it only
     adds currentPage-dayStartPage when positive). A page correction
     (negative net for that book that day) must never surface to the
     user as "읽은 페이지" - it isn't reading, so it's dropped here
     rather than netted into a total that could go negative. */
  function bookRecordsOnDate(dateStr){
    var out = [];
    getBooks().forEach(function(b){
      var net = 0;
      (b.pageLogs || []).forEach(function(log){
        if (log.date === dateStr) net += log.delta;
      });
      if (net > 0) out.push({ bookId: b.id, title: b.title, pages: net });
    });
    return out;
  }
  function pagesReadOnDate(dateStr){
    return bookRecordsOnDate(dateStr).reduce(function(sum, r){ return sum + r.pages; }, 0);
  }
  /* This month's days as calendar cells, Monday-start (leadBlanks =
     empty cells before the 1st so the grid lines up under 월~일). Only
     the real current month - no prev/next navigation in this version. */
  function monthCalendarDays(){
    var now = new Date();
    var year = now.getFullYear(), month = now.getMonth();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var firstWeekday = new Date(year, month, 1).getDay(); // 0=일..6=토
    var leadBlanks = firstWeekday === 0 ? 6 : firstWeekday - 1;
    var todayKey = dateKey(now);
    var cells = [];
    for (var d = 1; d <= daysInMonth; d++){
      var ds = dateKey(new Date(year, month, d));
      cells.push({ date: ds, day: d, isToday: ds === todayKey, hasRead: pagesReadOnDate(ds) > 0 });
    }
    return { label: (month + 1) + "월", leadBlanks: leadBlanks, cells: cells };
  }
  function fmtDayLabel(dateStr){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var days = ["일","월","화","수","목","금","토"];
    return parts[1] + "." + parts[2] + " (" + days[d.getDay()] + ")";
  }
  /* 월요일 시작. 오늘이 주 중간이면 그 시점까지만 합산. */
  function pagesReadThisWeek(){
    var now = new Date();
    var day = now.getDay();
    var mondayOffset = (day === 0 ? -6 : 1) - day;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
    var total = 0;
    for (var i = 0; i < 7; i++){
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      if (d > now) break;
      total += pagesReadOnDate(dateKey(d));
    }
    return total;
  }

  /* ---------------- persistence ---------------- */
  /* Applies an incoming doc snapshot to local state. Guarded by
     `updatedAt`: an optimistic local write always sets `updatedAt` to
     "now" before this can run, so a snapshot that is still catching up
     (older `updatedAt`) is ignored instead of clobbering the fresher
     local state — this is what previously let a delayed "book just
     created" snapshot silently undo a page-log that happened right
     after, reverting the bunny back to "기록 없음". */
  function applyDoc(id, data){
    if (!data){ delete state.books[id]; return; }
    var existing = state.books[id];
    if (existing && existing.updatedAt && data.updatedAt && data.updatedAt < existing.updatedAt){
      return;
    }
    state.books[id] = Object.assign({ id: id }, data);
  }

  // Book documents and original image Blobs are persisted in this origin.
  function storageTransaction(storeName, mode, action){
    return storageReady.then(function(){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, mode);
        var result;
        try { result = action(tx.objectStore(storeName)); }
        catch (err){ tx.abort(); reject(err); return; }
        tx.oncomplete = function(){ resolve(result && result.result); };
        tx.onerror = function(){ reject(tx.error); };
        tx.onabort = function(){ reject(tx.error || new Error("저장 작업이 취소됐어요.")); };
      });
    });
  }

  function storageFailed(err){
    console.error("북토끼 로컬 저장 실패", err);
    state.dbMode = "local";
    renderOffline();
  }

  function loadLocalState(){
    return Promise.all([
      storageTransaction("books", "readonly", function(store){ return store.getAll(); }),
      storageTransaction("images", "readonly", function(store){ return store.getAll(); })
    ]).then(function(results){
      var urls = {};
      results[1].forEach(function(image){ urls[image.id] = URL.createObjectURL(image.blob); });
      state.books = {};
      results[0].forEach(function(book){
        if (book.coverId && urls[book.coverId]) book.coverUrl = urls[book.coverId];
        applyDoc(book.id, book);
      });
      state.dbMode = "db";
      return { books:results[0], images:results[1] };
    });
  }

  function initDb(){
    // Do not let edits race with the initial restoration.
    document.getElementById("app").inert = true;
    storageReady = new Promise(function(resolve, reject){
      var request = indexedDB.open("booktokki", 1);
      request.onupgradeneeded = function(){
        var database = request.result;
        database.createObjectStore("books", { keyPath: "id" });
        database.createObjectStore("images", { keyPath: "id" });
      };
      request.onsuccess = function(){
        db = request.result;
        db.onversionchange = function(){ db.close(); storageFailed(new Error("저장소가 변경됐어요. 새로고침해 주세요.")); };
        resolve();
      };
      request.onerror = function(){ reject(request.error); };
      request.onblocked = function(){
        var error = new Error("다른 북토끼 탭을 닫고 새로고침해 주세요.");
        storageFailed(error);
        reject(error);
      };
    });
    return storageReady.then(loadLocalState).catch(function(error){
      storageFailed(error);
      throw error;
    }).finally(function(){
      document.getElementById("app").inert = false;
    });
  }

  function initAssets(){
    localImages = {
      upload: function(file){
        var id = uid();
        return storageTransaction("images", "readwrite", function(store){
          store.put({ id: id, blob: file });
        }).then(function(){
          return { id: id, url: URL.createObjectURL(file) };
        });
      }
    };
  }

  // Capture each optimistic change before the next mutation changes state.
  function persistBook(id){
    var data = JSON.parse(JSON.stringify(state.books[id]));
    return storageTransaction("books", "readwrite", function(store){ store.put(data); });
  }
  function persistBookData(data){
    var snapshot = JSON.parse(JSON.stringify(data));
    return storageTransaction("books", "readwrite", function(store){ store.put(snapshot); }).catch(function(error){
      storageFailed(error);
      error.name = "LocalWriteError";
      throw error;
    });
  }
  function writeBook(id, data){ return persistBook(id); }
  function writePatch(id, patch){ return persistBook(id); }
  function writeDelete(id){
    return storageTransaction("books", "readwrite", function(store){ store.delete(id); }).catch(function(error){
      storageFailed(error);
      error.name = "LocalWriteError";
      throw error;
    });
  }

  function cloudSaveFailed(error){
    console.error("북토끼 저장 실패", { name:error && error.name, code:error && error.code, status:error && error.status });
    var message = error && error.name === "CloudConflictError"
      ? "다른 곳에서 기록이 변경됐어요. 새로고침 후 다시 시도해 주세요."
      : error && error.name === "LocalWriteError"
        ? "Cloud에는 저장됐지만 이 기기에 저장하지 못했어요. 이 화면에서 다시 시도해 주세요."
        : "기록을 저장하지 못했어요. 다시 시도해 주세요.";
    window.alert(message);
  }
  function queueCloudMutation(bookId, action){
    var previous = cloudMutationQueues[bookId] || Promise.resolve();
    var next = previous.catch(function(){}).then(action);
    var queued = next.finally(function(){
      if (cloudMutationQueues[bookId] === queued) delete cloudMutationQueues[bookId];
    });
    cloudMutationQueues[bookId] = queued;
    return queued;
  }
  function trackAnalyticsEvent(buildEvent){
    try {
      if (!window.BooktokkiAnalyticsRepository) return Promise.resolve(false);
      var event = typeof buildEvent === "function" ? buildEvent() : buildEvent;
      return window.BooktokkiAnalyticsRepository.trackSafely(analyticsRepository, activeAuthUserId, event, function(error){
        console.error("북토끼 analytics 저장 실패", { code:error && error.code ? error.code : null });
      });
    } catch (error) {
      console.error("북토끼 analytics 준비 실패", { code:error && error.code ? error.code : null });
      return Promise.resolve(false);
    }
  }
  function localBookFromCloudRow(candidate, row){
    var next = Object.assign({}, candidate, {
      currentPage:row.current_page,
      status:row.status,
      completedAt:row.completed_at,
      lastPageLogDate:row.last_page_log_date,
      dayStartPage:row.day_start_page,
      updatedAt:row.updated_at
    });
    if (row.completion_reflection_text){
      next.completionReflection = {
        text:row.completion_reflection_text,
        createdAt:row.completion_reflection_created_at,
        updatedAt:row.completion_reflection_updated_at
      };
    } else delete next.completionReflection;
    return next;
  }
  function commitLocalBook(book, beforeRender){
    return persistBookData(book).then(function(){
      if (beforeRender) beforeRender();
      state.books[book.id] = book;
      renderAll();
      return book;
    });
  }

  /* ---------------- mutations ---------------- */
  /* Every mutation updates state.books and calls renderAll() FIRST (so
     the screen reflects the change immediately, with no wait on any
     round trip), then syncs the same change to the store. */
  function addBook(title, author, totalPages, cover, metadata){
    metadata = metadata || {};
    var createKey = JSON.stringify([title, author || "저자 미상", totalPages, metadata.isbn13 || null, metadata.sourceProvider || null, metadata.sourceId || null]);
    var pending = pendingBookCreates[createKey];
    var id = pending ? pending.id : uid();
    var data = pending ? pending.data : {
      title: title,
      author: author || "저자 미상",
      totalPages: totalPages,
      currentPage: 0,
      status: "toread",
      notes: [],
      pageLogs: [],
      createdAt: nowIso(),
      updatedAt: nowIso(),
      completedAt: null,
      lastPageLogDate: null,
      dayStartPage: null,
      coverId: (cover && cover.id) || null,
      coverUrl: (cover && cover.url) || null
    };
    var cloudBookId = null;
    ["isbn13", "publisher", "publishedAt", "sourceProvider", "sourceId"].forEach(function(key){
      if (metadata[key]) data[key] = metadata[key];
    });
    pendingBookCreates[createKey] = { id:id, data:data };
    if (!cloudRepository || !activeAuthUserId) return Promise.reject(new Error("Cloud repository is unavailable"));
    return cloudRepository.createBook(activeAuthUserId, Object.assign({ id:id }, data)).then(function(row){
      cloudBookId = row.id;
      data.updatedAt = row.updated_at;
      data.createdAt = row.created_at;
      return persistBookData(Object.assign({ id:id }, data));
    }).then(function(){
      applyDoc(id, data);
      renderAll();
      delete pendingBookCreates[createKey];
      if (window.BooktokkiAnalyticsRepository){
        trackAnalyticsEvent(function(){
          return window.BooktokkiAnalyticsRepository.bookAddedEvent("book_added:" + id, cloudBookId, data.createdAt);
        });
      }
      return id;
    }).catch(function(error){ cloudSaveFailed(error); throw error; });
  }

  /* Shared by logPage() and markDone() — both are "a page count was
     recorded for this book today", so both must flip the home bunny.
     `dayStartPage` is captured once, on the first page-log of a new
     day, so todayPagesRead() can report how many pages moved today. */
  function buildPageLogPatch(b, newPage){
    var total = b.totalPages;
    var p = Math.max(0, Math.min(total, newPage));
    var today = todayStr();
    var isNewLogDay = b.lastPageLogDate !== today;
    var patch = {
      currentPage: p,
      updatedAt: nowIso(),
      lastPageLogDate: today,
      dayStartPage: isNewLogDay ? b.currentPage : (typeof b.dayStartPage === "number" ? b.dayStartPage : b.currentPage)
    };
    /* History-only for now (no calendar/stats screen yet) - every actual
       page change is kept with its date so those can be built later
       without a data migration. */
    if (p !== b.currentPage){
      var logs = (b.pageLogs || []).slice();
      logs.push({
        id: uid(),
        date: today,
        prevPage: b.currentPage,
        currentPage: p,
        delta: p - b.currentPage,
        at: nowIso()
      });
      patch.pageLogs = logs;
    }
    if (p >= total && total > 0){
      patch.status = "done";
      patch.completedAt = b.completedAt || nowIso();
    } else {
      patch.status = p > 0 ? "reading" : "toread";
      patch.completedAt = null;
    }
    return patch;
  }

  function logPage(bookId, page, options){
    options = options || {};
    if (!state.books[bookId]) return Promise.resolve(false);
    return queueCloudMutation(bookId, function(){
      var b = state.books[bookId];
      var hadPageRecords = getBooks().some(function(book){ return (book.pageLogs || []).length > 0; });
      var shouldPromptForFeedback = false;
      var patch = buildPageLogPatch(b, page);
      var reaction = readingReaction(b, patch.currentPage);
      var reactionSeed = b.id + "|" + todayStr() + "|" + patch.currentPage;
      var log = patch.pageLogs && patch.pageLogs[patch.pageLogs.length - 1];
      var operation = { logId:log ? log.id : uid(), newPage:patch.currentPage, date:todayStr(), at:log ? log.at : patch.updatedAt };
      return cloudRepository.recordPage(activeAuthUserId, bookId, operation).then(function(result){
        shouldPromptForFeedback = !hadPageRecords && result.logCreated === true;
        var candidate = localBookFromCloudRow(Object.assign({}, b, patch, { pageLogs:result.logs }), result.book);
        if (result.logCreated && !log){ throw new Error("Unexpected Cloud page log"); }
        return commitLocalBook(candidate);
      }).then(function(){
        var pageInput = document.querySelector('[data-pageinput="' + bookId + '"]');
        if (pageInput){ pageInput.value = patch.currentPage; pageInput.defaultValue = patch.currentPage; }
        if (reaction && !options.suppressReaction) showReadingReaction(reaction, reactionSeed);
        if (shouldPromptForFeedback) queueFirstRecordFeedbackPrompt(activeAuthUserId);
        return true;
      });
    }).catch(function(error){
      var pageInput = document.querySelector('[data-pageinput="' + bookId + '"]');
      if (pageInput && state.books[bookId]) pageInput.value = state.books[bookId].currentPage;
      cloudSaveFailed(error);
      return false;
    });
  }

  // Read existing page history before the new record is applied.
  function readingReaction(book, nextPage){
    var delta = nextPage - book.currentPage;
    if (!(delta > 0)) return null;
    if (book.totalPages > 0 && nextPage >= book.totalPages) return "E";
    var previous = null;
    var latestTime = -Infinity;
    var latestBookIds = {};
    getBooks().forEach(function(b){
      (b.pageLogs || []).forEach(function(log){
        var time = Date.parse(log.at);
        if (!(log.delta > 0) || !Number.isFinite(time)) return;
        if (b.id === book.id && (!previous || time > Date.parse(previous.at))) previous = log;
        if (time > latestTime){ latestTime = time; latestBookIds = {}; }
        if (time === latestTime) latestBookIds[b.id] = true;
      });
    });
    if (previous){
      // Compare calendar dates, avoiding timezone/DST hour differences.
      var parts = previous.date && previous.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      var now = new Date();
      if (parts && (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
          Date.UTC(+parts[1], +parts[2]-1, +parts[3])) / 86400000 >= 3) return "B";
    }
    var latestIds = Object.keys(latestBookIds);
    if (latestIds.length === 1 && latestIds[0] !== book.id) return "C";
    // Integer cross-multiplication keeps the 15% boundary exact.
    if (delta >= 50 || (book.totalPages > 0 && delta * 100 >= book.totalPages * 15)) return "D";
    return "A";
  }

  var rabbitEventTimer = null;
  var READING_REACTIONS = {
    A: { img:"assets/bunny-sleep.png", text:"인간이 또 읽음.<br>방해 실패." },
    B: [
      { img:"assets/bunny-sleep.png", text:"다시 나타남.<br>독서 의지 말살 실패." },
      { img:"assets/bunny-sleep.png", text:"또 왔네.<br>이거 안 버렸네." },
      { img:"assets/bunny-sleep.png", text:"인간 복귀.<br>계획에 없었음." }
    ],
    C: { img:"assets/bunny-kick.png", text:"인간 또 딴 책 폄.<br>또 시작됨." },
    D: { img:"assets/bunny-sleep.png", text:"이건 좀 많이 읽는데.<br>작전 수정 필요." },
    E: { img:"assets/bunny-done.png", text:"인간이 끈질기네..<br>방해 실패." }
  };
  /* TODO(brand): bunny-done.png reads more triumphant than this dry,
     frustrated line. Replace the asset only after the next character
     pose is approved; keep the current Character Identity meanwhile. */
  var COMPLETION_REACTIONS = ["인간이 끈질기네..<br>방해 실패."];
  function hideReadingReaction(){
    clearTimeout(rabbitEventTimer);
    var el = document.getElementById("rabbitEvent");
    el.hidden = true;
    el.classList.remove("is-reacting");
    el.innerHTML = "";
  }
  function reactionVariantIndex(seed, length){
    var hash = 2166136261;
    var value = String(seed == null ? "" : seed);
    for (var i = 0; i < value.length; i++){
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0) % length;
  }
  function pickReadingReaction(mode, seed){
    var reactions = READING_REACTIONS[mode];
    return Array.isArray(reactions) ? reactions[reactionVariantIndex(seed, reactions.length)] : reactions;
  }
  function showReadingReaction(mode, seed){
    hideReadingReaction();
    var el = document.getElementById("rabbitEvent");
    var reaction = pickReadingReaction(mode, seed);
    el.innerHTML = '<img src="' + reaction.img + '" alt="북토끼"><div class="speech-bubble">' + reaction.text + '</div>';
    el.dataset.reaction = mode;
    el.hidden = false;
    void el.offsetWidth; // Restart the visit when a newer record replaces it.
    el.classList.add("is-reacting");
    rabbitEventTimer = setTimeout(hideReadingReaction, 4000);
  }

  function addNote(bookId, text, page, seed, options){
    var b = state.books[bookId];
    if (!b) return Promise.resolve(false);
    seed = seed || {};
    options = options || {};
    var noteId = seed.id || uid();
    var noteCreatedAt = seed.createdAt || nowIso();
    /* Notes never touch lastPageLogDate/dayStartPage/pageLogs — the
       home bunny and the page-history trail only react to an actual
       page record, never to a 북로그. */
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      /* Detail notes resolve their page only after earlier page writes in
         this book's queue have settled, so the snapshot is never stale. */
      var notePage = options.useCommittedPage ? current.currentPage : page;
      var note = { id:noteId, bookId:bookId, text:text, page:Number.isFinite(notePage) ? notePage : null, createdAt:noteCreatedAt };
      var notes = (current.notes || []).concat([note]);
      return cloudRepository.createNote(activeAuthUserId, bookId, note).then(function(result){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, { notes:notes }), result.book), function(){
          delete state.noteComposeDrafts[bookId];
          state.noteComposerOpenBookId = null;
        });
      }).then(function(){ return true; });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  function saveCompletionReflection(bookId, text){
    var b = state.books[bookId];
    if (!b || !text) return;
    var existing = b.completionReflection;
    var now = nowIso();
    var patch = {
      completionReflection: {
        text: text,
        createdAt: existing && existing.createdAt ? existing.createdAt : now,
        updatedAt: now
      },
      updatedAt: now
    };
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      return cloudRepository.updateBook(activeAuthUserId, bookId, {
        completion_reflection_text:patch.completionReflection.text,
        completion_reflection_created_at:patch.completionReflection.createdAt,
        completion_reflection_updated_at:patch.completionReflection.updatedAt
      }).then(function(row){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, patch), row), function(){
          delete state.completionReflectionDrafts[bookId];
          state.completionReflectionOpenBookId = null;
        });
      }).then(function(){ return true; });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  /* Editing a 북로그 only ever touches its text - the page/date it was
     written at is a record of that moment and stays put even if the
     wording gets cleaned up later. */
  function updateNote(bookId, noteId, text){
    var b = state.books[bookId];
    if (!b) return;
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      var notes = (current.notes || []).map(function(n){ return n.id === noteId ? Object.assign({}, n, { text:text }) : n; });
      return cloudRepository.updateNote(activeAuthUserId, bookId, noteId, text).then(function(result){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, { notes:notes }), result.book), function(){ state.editingNoteId = null; });
      }).then(function(){ return true; });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  function deleteNote(bookId, noteId){
    var b = state.books[bookId];
    if (!b) return;
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      var notes = (current.notes || []).filter(function(n){ return n.id !== noteId; });
      return cloudRepository.deleteNote(activeAuthUserId, bookId, noteId).then(function(row){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, { notes:notes }), row), function(){
          if (state.editingNoteId === noteId) state.editingNoteId = null;
        });
      }).then(function(){ return true; });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  function markDone(bookId){
    var b = state.books[bookId];
    return b ? logPage(bookId, b.totalPages, { suppressReaction:true }) : Promise.resolve(false);
  }
  function undoDone(bookId){
    var b = state.books[bookId];
    if (!b) return;
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      var patch = { status:current.currentPage > 0 ? "reading" : "toread", completedAt:null, updatedAt:nowIso() };
      return cloudRepository.updateBook(activeAuthUserId, bookId, { status:patch.status, completed_at:null }).then(function(row){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, patch), row));
      });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  /* "다 읽었어!" does the same completion write as before, then shows
     one dry, unimpressed reaction from the same home bunny - not a
     reward screen, just a beat before the detail view updates. */
  function handleMarkDone(bookId){
    hideReadingReaction();
    markDone(bookId).then(function(saved){ if (saved) showDoneCelebration(bookId); });
  }
  function openCompletionReflection(bookId){
    var b = state.books[bookId];
    if (!b) return;
    state.completionReflectionOpenBookId = bookId;
    if (!Object.prototype.hasOwnProperty.call(state.completionReflectionDrafts, bookId)){
      state.completionReflectionDrafts[bookId] = b.completionReflection ? b.completionReflection.text : "";
    }
    renderAll();
    setTimeout(function(){
      var input = document.getElementById("completionReflectionInput");
      if (input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }, 0);
  }
  function showDoneCelebration(bookId){
    var b = state.books[bookId];
    var seed = bookId + "|" + (b && b.completedAt ? b.completedAt : "");
    var copy = COMPLETION_REACTIONS[reactionVariantIndex(seed, COMPLETION_REACTIONS.length)];
    openModal('' +
      '<div class="modal completion-modal">' +
        '<div class="speech-bubble">' + copy + '</div>' +
        '<div class="bunny-figure">' +
          '<img class="bunny-done-img" src="assets/bunny-done.png" alt="책 위에 올라가 뻐기듯 서 있는 토끼">' +
        '</div>' +
        '<button class="done-reflection-link" id="doneReflectionOpen" type="button">이 책을 다 읽고 든 생각 남기기</button>' +
        '<button class="btn btn-dark" id="doneCelebrateClose" style="width:100%;">확인</button>' +
      '</div>');
    document.getElementById("doneCelebrateClose").onclick = closeModal;
    document.getElementById("doneReflectionOpen").onclick = function(){

  function setCover(bookId, cover){
    var b = state.books[bookId];
    if (!b) return;
    var patch = { coverId: cover.id, coverUrl: cover.url, updatedAt: nowIso() };
    return queueCloudMutation(bookId, function(){
      var current = state.books[bookId];
      return cloudRepository.updateBook(activeAuthUserId, bookId, { cover_source_url:null }).then(function(row){
        return commitLocalBook(localBookFromCloudRow(Object.assign({}, current, patch), row));
      });

  function removeBook(bookId){
    if (!state.books[bookId]) return Promise.resolve(false);
    return queueCloudMutation(bookId, function(){
      return cloudRepository.deleteBook(activeAuthUserId, bookId).then(function(){
        return writeDelete(bookId);
      }).then(function(){
        delete state.books[bookId];
        if (state.selectedBookId === bookId) state.selectedBookId = null;
        renderAll();
        return true;
      });
    }).catch(function(error){ cloudSaveFailed(error); return false; });
  }

  /* ---------------- nav ---------------- */
  /* No bottom tab bar: home is the default screen, and 서재/책 상세 are
     reached by tapping into them and left again with an explicit back
     button — so `detailFrom` remembers whether a book was opened from
     home (요즘 읽는 책), 통계, or 서재, and that back button returns there. */
  function goTo(view, bookId){
    if (view === "stats" && state.view !== "stats"){
      state.statsMonth = null;
      state.statsArchivePanel = null;
      state.statsFrom = "home";
    }
    if (view === "feedback" && state.view !== "feedback"){
      state.feedbackFrom = state.view;
      state.feedbackStatus = null;
    }
    state.view = view;
    if (typeof bookId !== "undefined") state.selectedBookId = bookId;
    state.editingNoteId = null; /* leaving/entering a screen always drops any open 북로그 edit */
    state.statsSelectedDate = null; /* re-entering 통계 always starts back on today */
    renderAll();
  }
  function openMyBooklogs(){
    state.statsFrom = "my";
    state.statsMonth = null;
    state.statsSelectedDate = null;
    state.statsArchivePanel = "notes";
    state.view = "stats";
    state.editingNoteId = null;
    renderAll();
  }
  function openBook(bookId, from){
    state.detailFrom = (from === "home") ? "home" : (from === "stats" ? "stats" : "library");
    goTo("detail", bookId);
  }

  /* ---------------- render ---------------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function renderAll(){
    document.body.classList.toggle("home-prototype", state.view === "home");
    document.body.classList.toggle("detail-prototype", state.view === "detail");
    document.body.classList.toggle("library-prototype", state.view === "library");
    document.body.classList.toggle("stats-prototype", state.view === "stats");
    document.body.classList.toggle("my-prototype", state.view === "my" || state.view === "feedback" || state.view === "data-info");
    document.querySelector(".topbar h1").textContent = state.view === "home" ? "BOOKTOKKI" : "내 독서 기록";
    // Keep unsaved inputs only when the same book/input survives the render.
    var detail = document.getElementById("view-detail");
    var oldPage = detail.querySelector("[data-pageinput]");
    var draftBookId = oldPage && oldPage.getAttribute("data-pageinput");
    var drafts = [];
    detail.querySelectorAll("textarea, [data-pageinput]").forEach(function(input){
      if (input.hasAttribute("data-pageinput") && input.value === input.defaultValue) return;
      drafts.push({
        selector: input.id ? "#" + input.id : (input.hasAttribute("data-editnoteinput")
          ? '[data-editnoteinput="' + input.getAttribute("data-editnoteinput") + '"]'
          : "[data-pageinput]"),
        value: input.value,
        focused: document.activeElement === input,
        start: input.selectionStart,
        end: input.selectionEnd
      });
    });
    document.getElementById("view-home").hidden = state.view !== "home";
    document.getElementById("view-library").hidden = state.view !== "library";
    document.getElementById("view-detail").hidden = state.view !== "detail";
    document.getElementById("view-stats").hidden = state.view !== "stats";
    document.getElementById("view-my").hidden = state.view !== "my";
    document.getElementById("view-feedback").hidden = state.view !== "feedback";
    document.getElementById("view-data-info").hidden = state.view !== "data-info";
    document.getElementById("libraryNavBtn").hidden = state.view === "library";
    document.getElementById("statsNavBtn").hidden = state.view === "stats";
    document.getElementById("myNavBtn").hidden = state.view === "my" || state.view === "feedback" || state.view === "data-info";

    renderOffline();
    renderHome();
    renderLibrary();
    renderDetail();
    renderStats();
    renderMy();
    renderFeedback();
    renderDataInfo();
    if (draftBookId === state.selectedBookId){
      drafts.forEach(function(draft){
        var input = detail.querySelector(draft.selector);
        if (!input) return;
        input.value = draft.value;
        if (draft.focused && state.view === "detail"){
          input.focus({ preventScroll: true });
          if (draft.start !== null) input.setSelectionRange(draft.start, draft.end);
        }
      });
    }
  }

  function renderOffline(){

  /* Character Master 기준 이미지 에셋 풀. 홈 토끼는 이 목록의 PNG만
     사용하며 새 행동도 같은 캐릭터 에셋으로 추가한다. */
  var BUNNY_NONE = [
    { img: "assets/bunny-chew.png", alt: "책을 갉아먹는 토끼", bubble: "독서 안 함?<br>ㅇㅋ 책 내가 먹음" },
    { img: "assets/bunny-kick.png", alt: "뒷발로 모래를 차서 책을 덮는 토끼", bubble: "증거 인멸 중" }
  ];
  var BUNNY_LOGGED = [
    { img: "assets/bunny-sleep.png", alt: "책 위에 퍼져 자는 토끼", bubble: "인간이 책을 읽음<br>계획에 없던 일임" }
  ];

  /* Stable for the whole day (re-rendering shouldn't make the rabbit
     twitch between poses), varies day to day, and is picked
     independently for each mode so switching "기록 없음 → 있음"
     doesn't just reuse whatever index the other pool happened to
     land on. */
  function hashStr(s){
    var h = 0;
    for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function pickBunnyBehavior(pool, seedKey){
    return pool[hashStr(todayStr() + "|" + seedKey) % pool.length];
  }

  /* The home screen's centerpiece: the rabbit, larger and front and
     center, with its speech bubble reading like it's actually saying
     something in the room — not a compact status row anymore. Same
     hasLoggedToday()/todayPagesRead() logic as before; only the pose
     pool and layout changed. */
  function bunnyHero(){
    var logged = hasLoggedToday();
    var pick = pickBunnyBehavior(logged ? BUNNY_LOGGED : BUNNY_NONE, logged ? "logged" : "none");
    var img = '<img class="bunny-img" src="' + esc(pick.img) + '" alt="' + esc(pick.alt || "") + '">';
    var caption = pick.caption || "";
    var zzz = pick.zzz ? '<div class="zzz"><span class="z1">Z</span><span class="z2">z</span><span class="z3">z</span></div>' : "";
    var bubble = pick.bubble;
    var status;
    if (logged){
      var todayPages = todayPagesRead();
      status = "오늘 기록 있음" + (todayPages > 0 ? "<br>오늘 " + todayPages + "p 읽음" : "");
    } else {
      status = "오늘 기록 없음";
    }
    return '' +
      '<div class="card bunny-hero' + (logged ? ' is-recorded' : '') + '">' +
        '<div class="rabbit-scene">' +
          '<div class="speech-bubble">' + bubble + '</div>' +
          '<div class="bunny-figure">' + zzz + img + '</div>' +
        '</div>' +
        (caption ? '<div class="bunny-caption">' + caption + '</div>' : '') +
        '<div class="bunny-status">' + status + '</div>' +
      '</div>';
  }

  /* This month's distinct books with at least one positive page record. */
  function statLine(){
    var now = new Date();
    var prefix = dateKey(now).slice(0, 7) + "-";
    var n = getBooks().filter(function(b){
      return (b.pageLogs || []).some(function(log){
        return log.delta > 0 && typeof log.date === "string" && log.date.indexOf(prefix) === 0;
      });
    }).length;
    return '<button class="stat-line" data-nav="stats">' +
      '<span class="monthly-label">' + (now.getMonth()+1) + '월에 읽은 책</span>' +
      '<span class="monthly-value"><b>' + n + '</b><span class="monthly-unit">권</span><span class="monthly-arrow" aria-hidden="true">›</span></span></button>';
  }

  /* Shared by the existing statistics book rows. The v0.6 library uses
     its own quieter completion trace, but stats keeps this marker. */
  function bunnyEarMarker(){
    return '' +
      '<svg class="ear-marker pixel-bunny" viewBox="0 0 18 22" shape-rendering="crispEdges" aria-hidden="true">' +
        '<rect class="fur" x="4" y="2" width="4" height="9"/>' +
        '<rect class="fur" x="10" y="2" width="4" height="9"/>' +
        '<rect class="ear-inner" x="5" y="4" width="2" height="5"/>' +

  function libraryTraceForBook(b, latestPositiveBookId){
    var positives = (b.pageLogs || []).filter(function(log){
      return log.delta > 0 && /^\d{4}-\d{2}-\d{2}$/.test(log.date || "");
    }).slice().sort(function(a, c){ return (Date.parse(a.at) || 0) - (Date.parse(c.at) || 0); });
    var returnCount = 0;
    var previousDate = null;
    positives.forEach(function(log){
      var parts = log.date.split("-").map(Number);
      var day = Date.UTC(parts[0], parts[1]-1, parts[2]);
      if (previousDate != null && (day - previousDate) / 86400000 >= 3) returnCount += 1;
      previousDate = day;
    });
    var notes = b.notes || [];
    var distinctPages = {};
    notes.forEach(function(note){ if (note.page != null) distinctPages[String(note.page)] = true; });
    var distinctPageCount = Object.keys(distinctPages).length;
    var noteTabs = notes.length === 0 ? 0 :
      ((distinctPageCount >= 3 || notes.length >= 4) ? 3 : (notes.length >= 2 ? 2 : 1));
    return {
      hasPositive: positives.length > 0,
      returnCount: returnCount,
      noteTabs: noteTabs,
      isLatest: b.id === latestPositiveBookId
    };
  }

  function latestPositiveBookId(){
    var latestId = null;
    var latestTime = -Infinity;
    getBooks().forEach(function(book){
      (book.pageLogs || []).forEach(function(log){
        if (!(log.delta > 0)) return;
        var time = Date.parse(log.at);
        if (Number.isFinite(time) && time > latestTime){ latestTime = time; latestId = book.id; }
      });
    });
    return latestId;
  }

  /* Reading history stays derived from pageLogs/notes; no trace is stored. */
  function spineEl(b, index, latestBookId){
    var p = pct(b.currentPage, b.totalPages);
    var widthPx = Math.max(28, Math.min(34, 28 + Math.round(b.totalPages / 32)));
    var heightPx = 98 + ((index * 7 + b.id.length) % 3) * 6;
    var styleParts = ["background:" + coverColor(b.id) + ";"];
    var trace = libraryTraceForBook(b, latestBookId);
    var completed = b.status === "done" || !!b.completedAt;
    var inner = '<div class="spine-label">' + esc(b.title) + '</div>';
    var doneLabel = completed ? " (완독)" : "";
    var noteTabs = "";
    for (var i = 0; i < trace.noteTabs; i++) noteTabs += '<span class="note-tab"></span>';
    var leanClass = index % 8 === 2 ? " lean-left" : (index % 8 === 6 ? " lean-right" : "");
    return '' +
      '<div class="spine-wrap">' +
        '<div class="book-object' + leanClass + '" style="--spine-width:' + widthPx + 'px;--spine-height:' + heightPx + 'px;">' +
          (trace.isLatest ? '<img class="library-rabbit" src="assets/bunny-sleep.png" alt="최근 읽은 책 위에서 자는 북토끼">' : '') +
          (trace.returnCount ? '<span class="wear-trace' + (trace.returnCount > 1 ? ' is-returned-more' : '') + '"></span>' : '') +
          (trace.noteTabs ? '<span class="note-tabs">' + noteTabs + '</span>' : '') +
          (completed ? '<span class="completion-mark"></span>' : '') +
          '<button class="spine" style="' + styleParts.join("") + '" data-open="' + b.id + '" data-open-from="library" aria-label="' + esc(b.title) + doneLabel + '">' +
            inner +
            '<div class="spine-progress"><div class="spine-progress-fill" style="width:' + p + '%"></div></div>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* Stats derives recorded activity without treating page movement as reading volume. */
  function validStatsDate(value){
    if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    var parts = value.split("-").map(Number);
    return dateKey(new Date(parts[0], parts[1] - 1, parts[2])) === value;
  }
  function statsMonthData(monthKey){
    var prefix = monthKey + "-";
    var days = {};
    var books = [];
    getBooks().forEach(function(book){
      var activeDates = {};
      var latestAt = -Infinity;
      var latestDate = "";
      (book.pageLogs || []).forEach(function(log){
        if (!(log.delta > 0) || !validStatsDate(log.date) || log.date.indexOf(prefix) !== 0) return;
        var time = Date.parse(log.at);
        if (!Number.isFinite(time)) return;
        activeDates[log.date] = true;
        days[log.date] = days[log.date] || {};
        days[log.date][book.id] = true;
        if (time > latestAt){ latestAt = time; latestDate = log.date; }
      });
      var readDays = Object.keys(activeDates).length;
      if (!readDays) return;
      var noteCount = (book.notes || []).filter(function(note){
        var time = Date.parse(note.createdAt);
        return Number.isFinite(time) && dateKey(new Date(time)).indexOf(prefix) === 0;
      }).length;
      books.push({ book:book, readDays:readDays, noteCount:noteCount, latestAt:latestAt, latestDate:latestDate });
    });
    books.sort(function(a, b){ return b.latestAt - a.latestAt || a.book.title.localeCompare(b.book.title, "ko") || a.book.id.localeCompare(b.book.id); });
    var noteGroups = [];
    var allNotes = 0;
    getBooks().forEach(function(book){
      var monthNotes = (book.notes || []).filter(function(note){
        var time = Date.parse(note.createdAt);
        return Number.isFinite(time) && dateKey(new Date(time)).indexOf(prefix) === 0;
      }).sort(function(a, b){ return Date.parse(a.createdAt) - Date.parse(b.createdAt); });
      if (monthNotes.length){
        allNotes += monthNotes.length;
        noteGroups.push({ book:book, notes:monthNotes });
      }
    });
    noteGroups.sort(function(a, b){
      var aTime = Date.parse(a.notes[a.notes.length - 1].createdAt) || 0;
      var bTime = Date.parse(b.notes[b.notes.length - 1].createdAt) || 0;
      return bTime - aTime || a.book.title.localeCompare(b.book.title, "ko");
    });
    var completed = getBooks().filter(function(book){
      if (book.status !== "done") return false;
      var time = Date.parse(book.completedAt);
      return Number.isFinite(time) && dateKey(new Date(time)).indexOf(prefix) === 0;
    }).length;
    return { books:books, days:days, readDays:Object.keys(days).length, notes:allNotes, completed:completed, noteGroups:noteGroups };
  }
  function statsMonthCalendar(monthKey, activeDays){
    var parts = monthKey.split("-").map(Number);
    var year = parts[0], month = parts[1] - 1;
    var first = new Date(year, month, 1);
    var count = new Date(year, month + 1, 0).getDate();
    var blanks = (first.getDay() + 6) % 7;
    var cells = [];
    for (var day = 1; day <= count; day++){
      var key = dateKey(new Date(year, month, day));
      cells.push({ date:key, day:day, isToday:key === dateKey(new Date()), hasRead:!!activeDays[key] });
    }
    return { label:(month + 1) + "월", leadBlanks:blanks, cells:cells };
  }
  function statsDateLabel(date){
    var parts = date.split("-").map(Number);
    return parts[1] + "월 " + parts[2] + "일";
  }
  function statsCover(book){
    if (book.coverUrl) return '<span class="stats-cover"><img src="' + esc(book.coverUrl) + '" alt=""></span>';
    return '<span class="stats-cover stats-cover-fallback" style="background:' + coverColor(book.id) + '">' + esc((book.title || "?").charAt(0)) + '</span>';
  }
  function renderStats(){
    var el = document.getElementById("view-stats");
    var statsBackTarget = state.statsFrom === "my" ? "my" : "home";
    var header = '' +
      '<div class="sub-topbar">' +
        '<button class="back-btn" data-nav="' + statsBackTarget + '" title="뒤로" aria-label="뒤로">' +
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<h2 class="stats-title">독서 캘린더</h2>' +
      '</div>';

    var monthKey = state.statsMonth || dateKey(new Date()).slice(0, 7);
    var data = statsMonthData(monthKey);
    var cal = statsMonthCalendar(monthKey, data.days);
    var recordedDates = Object.keys(data.days).sort();
    var selDate = state.statsSelectedDate || recordedDates[recordedDates.length - 1] ||
      (monthKey === dateKey(new Date()).slice(0, 7) ? dateKey(new Date()) : null);
    var dayIds = (selDate && data.days[selDate]) || {};
    var dayBooks = getBooks().filter(function(book){ return !!dayIds[book.id]; });
    dayBooks.sort(function(a, b){ return a.title.localeCompare(b.title, "ko") || a.id.localeCompare(b.id); });

    var weekdayNames = ["월","화","수","목","금","토","일"];

    var leadHtml = "";

    var daysHtml = cal.cells.map(function(c){

      return '<button class="' + cls + '" data-selectday="' + c.date + '">' +

    var archiveHtml = "";

        (data.books.length ? '<div class="stats-archive-books">' + data.books.map(function(entry){

          return '<button type="button" class="stats-archive-book" data-open="' + entry.book.id + '" data-open-from="stats">' +
            statsCover(entry.book) + '<span class="stats-archive-copy"><span class="stats-book-title">' + esc(entry.book.title) + '</span>' +
            '<span class="stats-book-meta">읽은 날 ' + entry.readDays + '일' + (entry.noteCount ? ' · 북로그 ' + entry.noteCount + '개' : '') +
              (entry.book.status === "done" ? ' · 완독' : '') + '</span>' +
            (reflection ? '<span class="stats-reflection">“' + esc(reflection.text) + '”</span>' : '') +
            '</span></button>';
        }).join("") + '</div>' : '<p class="stats-empty">기록 없음</p>') + '</section>';
    } else if (state.statsArchivePanel === "notes"){
      archiveHtml = '<section class="stats-archive-panel"><div class="stats-archive-heading">' + cal.label + ' 북로그</div>' +
        (data.noteGroups.length ? '<div class="stats-note-groups">' + data.noteGroups.map(function(group){
          return '<div class="stats-note-group"><button type="button" class="stats-note-book" data-open="' + group.book.id + '" data-open-from="stats">' +
            statsCover(group.book) + '<span>' + esc(group.book.title) + '</span></button>' +
            group.notes.map(function(note){
              var meta = (note.page != null ? 'p.' + note.page + ' · ' : '') + fmtMonthDay(note.createdAt);
              return '<button type="button" class="stats-note-row" data-open="' + group.book.id + '" data-open-from="stats">' +
                '<span class="stats-note-meta">' + meta + '</span><span class="stats-note-text">“' + esc(note.text) + '”</span></button>';
            }).join("") + '</div>';
        }).join("") + '</div>' : '<p class="stats-empty">기록 없음</p>') + '</section>';
    }

    el.innerHTML = header +
      '<section class="stats-month-summary">' +
        '<div class="stats-month-nav"><button type="button" data-stats-month="-1" aria-label="이전 달">‹</button><h3>' + cal.label + '</h3><button type="button" data-stats-month="1" aria-label="다음 달">›</button></div>' +
        '<div class="stats-summary">' +
          '<button type="button" class="stats-summary-item stats-summary-entry" data-stats-panel="books" aria-expanded="' + (state.statsArchivePanel === "books") + '"><span class="stats-summary-label">읽은 책</span><span class="stats-summary-value">' + data.books.length + '<small>권</small></span><span class="stats-entry-arrow">›</span></button>' +
          '<div class="stats-summary-item"><span class="stats-summary-label">읽은 날</span><span class="stats-summary-value">' + data.readDays + '<small>일</small></span></div>' +
          '<button type="button" class="stats-summary-item stats-summary-entry" data-stats-panel="notes" aria-expanded="' + (state.statsArchivePanel === "notes") + '"><span class="stats-summary-label">북로그</span><span class="stats-summary-value">' + data.notes + '<small>개</small></span><span class="stats-entry-arrow">›</span></button>' +
        '</div>' +
        (data.completed ? '<div class="stats-completed">완독 ' + data.completed + '권</div>' : '') +
      '</section>' +
      '<section class="stats-calendar-section">' +
        '<div class="cal-card">' +
          '<div class="cal-grid cal-weekdays-row">' + weekdaysHtml + '</div>' +
          '<div class="cal-grid cal-days-grid">' + leadHtml + daysHtml + '</div>' +
        '</div>' +
      '</section>' +
      (selDate ? '<section class="stats-day-section">' +
        '<div class="stats-heading">' + statsDateLabel(selDate) + '</div>' +
        '<div class="stats-day-list">' +
          (dayBooks.length ? dayBooks.map(function(book){
            return '<button type="button" class="stats-day-row" data-open="' + book.id + '" data-open-from="stats">' + statsCover(book) + '<span>' + esc(book.title) + '</span></button>';
          }).join("") : '<p class="stats-empty">기록 없음</p>') +
        '</div>' +
      '</section>' : '') +
      archiveHtml;
  }
