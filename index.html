  /* ---------------- modals ---------------- */
  var overlay = document.getElementById("modalOverlay");
  var modalBeforeClose = null;
  function closeModal(){
    var beforeClose = modalBeforeClose;
    modalBeforeClose = null;
    if (beforeClose){
      try { beforeClose(); }
      catch (error) { console.error("북토끼 modal close 처리 실패"); }
    }
    overlay.hidden = true;
    overlay.innerHTML = "";
  }
  function openModal(html){
    modalBeforeClose = null;
    overlay.innerHTML = html;
    overlay.hidden = false;
    var first = overlay.querySelector("input, textarea");
    if (first) setTimeout(function(){ first.focus(); }, 30);
  }
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !overlay.hidden) closeModal();
  });

  var pendingFirstRecordFeedbackUserId = null;
  var feedbackPromptWaitTimer = null;
  function feedbackPromptFlagKey(userId){ return FEEDBACK_PROMPT_FLAG_PREFIX + userId; }
  function feedbackPromptWasShown(userId){
    try { return window.localStorage.getItem(feedbackPromptFlagKey(userId)) === "shown"; }
    catch (_error) { return true; }
  }
  function feedbackPromptSafeToShow(){
    var rabbit = document.getElementById("rabbitEvent");
    var active = document.activeElement;
    var typing = active && typeof active.matches === "function" && active.matches("input, textarea, select, [contenteditable]");
    return appStarted && overlay.hidden && (!rabbit || rabbit.hidden) &&
      Object.keys(cloudMutationQueues).length === 0 && !state.feedbackSubmitting && !typing;
  }
  function showFirstRecordFeedbackPrompt(userId){
    if (!userId || userId !== activeAuthUserId || feedbackPromptWasShown(userId)) return false;
    try { window.localStorage.setItem(feedbackPromptFlagKey(userId), "shown"); }
    catch (_error) { return false; }
    var feedbackOrigin = state.view;
    openModal('<div class="modal"><h2>북토끼는 아직 자라는 중이에요 🐰</h2>' +
      '<p class="my-form-intro">쓰다가 이상하거나 아쉬운 점이 있었다면 편하게 알려주세요.</p>' +
      '<div class="modal-actions"><button class="btn btn-outline" type="button" id="feedbackPromptLater">나중에</button>' +
      '<button class="btn btn-dark" type="button" id="feedbackPromptSend">의견 보내기</button></div></div>');
    document.getElementById("feedbackPromptLater").onclick = closeModal;
    document.getElementById("feedbackPromptSend").onclick = function(){
      closeModal();
      state.feedbackFrom = feedbackOrigin;
      goTo("feedback");
    };
    return true;
  }
  function tryShowFirstRecordFeedbackPrompt(){
    var userId = pendingFirstRecordFeedbackUserId;
    if (!userId) return;
    if (userId !== activeAuthUserId || feedbackPromptWasShown(userId)){
      pendingFirstRecordFeedbackUserId = null;
      return;
    }
    if (feedbackPromptSafeToShow()){
      pendingFirstRecordFeedbackUserId = null;
      showFirstRecordFeedbackPrompt(userId);
      return;
    }
    feedbackPromptWaitTimer = setTimeout(tryShowFirstRecordFeedbackPrompt, 250);
  }
  function queueFirstRecordFeedbackPrompt(userId){
    if (!userId || feedbackPromptWasShown(userId) || pendingFirstRecordFeedbackUserId) return false;
    pendingFirstRecordFeedbackUserId = userId;
    clearTimeout(feedbackPromptWaitTimer);
    feedbackPromptWaitTimer = setTimeout(tryShowFirstRecordFeedbackPrompt, 250);
    return true;
  }

  function bookSearchCover(book){
    return '<div class="book-search-cover">' +
      (book.coverUrl ? '<img src="' + esc(book.coverUrl) + '" alt="" data-search-cover>' : '<span>표지 없음</span>') +
      '</div>';
  }

  function bindSearchCoverFallbacks(){
    overlay.querySelectorAll("[data-search-cover]").forEach(function(image){
      image.addEventListener("error", function(){
        var cover = image.parentElement;
        image.remove();
        cover.innerHTML = '<span>표지 없음</span>';
      }, { once:true });
    });
  }

  function searchBooks(query){
    if (!BOOK_SEARCH_ENDPOINT) return Promise.reject(new Error("SEARCH_NOT_CONFIGURED"));
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 10000);
    return fetch(BOOK_SEARCH_ENDPOINT + "?q=" + encodeURIComponent(query), {
      method: "GET",
      credentials: "omit",
      cache: "no-store",
      signal: controller.signal
    }).then(function(response){
      if (!response.ok) throw new Error("SEARCH_FAILED");
      return response.json();
    }).then(function(data){
      return Array.isArray(data.books) ? data.books : [];
    }).finally(function(){ clearTimeout(timer); });
  }

  function modalAddBook(from){
    openModal('' +
      '<div class="modal book-search-modal">' +
        '<h2>읽을 책 추가</h2>' +
        '<form class="book-search-form" id="bookSearchForm">' +
          '<input class="book-search-input" id="bookSearchInput" type="search" maxlength="100" autocomplete="off" placeholder="책 제목이나 저자를 검색해보세요" aria-label="책 제목이나 저자 검색">' +
          '<button class="book-search-submit" id="bookSearchSubmit" type="submit">검색</button>' +
        '</form>' +
        '<div class="book-search-status" id="bookSearchStatus" role="status"></div>' +
        '<div class="book-search-results" id="bookSearchResults"></div>' +
        '<button class="book-search-direct" id="manualAddBook" type="button">직접 추가하기</button>' +
        '<button class="book-search-direct" id="addBookCancel" type="button">취소</button>' +
      '</div>');

    var form = document.getElementById("bookSearchForm");
    var input = document.getElementById("bookSearchInput");
    var submit = document.getElementById("bookSearchSubmit");
    var status = document.getElementById("bookSearchStatus");
    var results = document.getElementById("bookSearchResults");

    function setResults(books){
      if (!books.length){
        results.innerHTML = "";
        status.textContent = "검색 결과 없음";
        return;
      }
      status.textContent = books.length + "권";
      results.innerHTML = books.map(function(book, index){
        var author = (book.authors || []).join(", ") || "저자 미상";
        var details = [author, book.publisher, (book.publishedAt || "").slice(0, 4)].filter(Boolean).join(" · ");
        return '<button class="book-search-result" type="button" data-search-result="' + index + '">' +
          bookSearchCover(book) +
          '<span class="book-search-copy"><span class="book-search-title">' + esc(book.title) + '</span>' +
          '<span class="book-search-meta">' + esc(details) + '</span></span></button>';
      }).join("");
      bindSearchCoverFallbacks();
      results.querySelectorAll("[data-search-result]").forEach(function(button){
        button.addEventListener("click", function(){
          modalAddSearchedBook(from, books[Number(button.getAttribute("data-search-result"))]);
        });
      });
    }

    form.addEventListener("submit", function(event){
      event.preventDefault();
      var query = input.value.trim();
      if (!query){ status.textContent = "검색어를 입력해 주세요."; input.focus(); return; }
      submit.disabled = true;
      submit.textContent = "검색 중";
      status.textContent = "검색 중...";
      results.innerHTML = "";
      searchBooks(query).then(setResults).catch(function(error){
        if (error.message === "SEARCH_NOT_CONFIGURED") status.textContent = "책 검색 연결 설정이 필요해요.";
        else if (error.name === "AbortError") status.textContent = "검색 시간이 초과됐어요. 다시 시도해 주세요.";
        else status.textContent = "책을 검색하지 못했어요. 다시 시도하거나 직접 추가해 주세요.";
      }).finally(function(){
        submit.disabled = false;
        submit.textContent = "검색";
      });
    });
    document.getElementById("manualAddBook").onclick = function(){ modalAddBookManual(from); };
    document.getElementById("addBookCancel").onclick = closeModal;
  }

  function modalAddSearchedBook(from, book){
    if (!book) return;
    var author = (book.authors || []).join(", ") || "저자 미상";
    var details = [author, book.publisher, (book.publishedAt || "").slice(0, 4)].filter(Boolean).join(" · ");
    openModal('' +
      '<div class="modal book-search-modal">' +
        '<button class="book-search-back" id="searchBookBack" type="button">‹ 검색 결과</button>' +
        '<div class="book-search-selection">' + bookSearchCover(book) +
          '<div class="book-search-copy"><div class="book-search-title">' + esc(book.title) + '</div>' +
          '<div class="book-search-meta">' + esc(details) + '</div></div>' +
        '</div>' +
        '<div class="field"><label for="f-search-total">전체 페이지</label><input id="f-search-total" type="number" inputmode="numeric" min="1" placeholder="예: 264"></div>' +
        '<div class="modal-error" id="addSearchBookErr" hidden></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-outline" id="addSearchBookCancel" type="button">취소</button>' +
          '<button class="btn btn-dark" id="addSearchBookSave" type="button">추가하기</button>' +
        '</div>' +
      '</div>');
    bindSearchCoverFallbacks();
    document.getElementById("searchBookBack").onclick = function(){ modalAddBook(from); };
    document.getElementById("addSearchBookCancel").onclick = closeModal;
    document.getElementById("addSearchBookSave").onclick = function(){
      var total = parseInt(document.getElementById("f-search-total").value, 10);
      var err = document.getElementById("addSearchBookErr");
      if (!total || total <= 0){ err.textContent = "전체 페이지 수를 입력해 주세요."; err.hidden = false; return; }
      addBook(book.title, author, total,
        book.coverUrl ? { id:null, url:book.coverUrl } : null,
        {
          isbn13: book.isbn13 || null,
          publisher: book.publisher || null,
          publishedAt: book.publishedAt || null,
          sourceProvider: book.source || "kakao",
          sourceId: book.sourceId || null
        }).then(function(id){ closeModal(); openBook(id, from); }).catch(function(){});
    };
  }

  function modalAddBookManual(from){
    openModal('' +
      '<div class="modal book-search-modal">' +
        '<button class="book-search-back" id="manualBookBack" type="button">‹ 책 검색</button>' +
        '<h2>읽을 책 추가</h2>' +
        '<div class="field"><label for="f-title">제목</label><input id="f-title" type="text" placeholder="예: 아몬드" maxlength="80"></div>' +
        '<div class="field"><label for="f-author">저자</label><input id="f-author" type="text" placeholder="예: 손원평" maxlength="60"></div>' +
        '<div class="field"><label for="f-total">전체 페이지</label><input id="f-total" type="number" inputmode="numeric" min="1" placeholder="예: 264"></div>' +
        '<div class="field">' +
          '<label for="f-cover">표지 이미지 (선택)</label>' +
          '<input id="f-cover" type="file" accept="image/*">' +
          '<div class="field-hint">제목·저자로 표지를 자동으로 찾아오는 기능은 아직 지원하지 않아요. 가진 사진이 있다면 올려주세요.</div>' +
        '</div>' +
        '<div class="modal-error" id="addBookErr" hidden></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-outline" id="addBookCancel">취소</button>' +
          '<button class="btn btn-dark" id="addBookSave">추가하기</button>' +
        '</div>' +
      '</div>');
    document.getElementById("manualBookBack").onclick = function(){ modalAddBook(from); };
    document.getElementById("addBookCancel").onclick = closeModal;
    document.getElementById("addBookSave").onclick = function(){
      var title = document.getElementById("f-title").value.trim();
      var author = document.getElementById("f-author").value.trim();
      var total = parseInt(document.getElementById("f-total").value, 10);
      var file = document.getElementById("f-cover").files[0];
      var err = document.getElementById("addBookErr");
      if (!title){ err.textContent = "제목을 입력해 주세요."; err.hidden = false; return; }
      if (!total || total <= 0){ err.textContent = "전체 페이지 수를 입력해 주세요."; err.hidden = false; return; }
      var saveBtn = document.getElementById("addBookSave");
      function finish(cover){
        addBook(title, author, total, cover).then(function(id){ closeModal(); openBook(id, from); }).catch(function(){
          saveBtn.disabled = false;
          saveBtn.textContent = "추가하기";
        });
      }
      if (file && localImages){
        saveBtn.disabled = true;
        saveBtn.textContent = "업로드 중...";
        localImages.upload(file).then(function(res){
          finish({ id: res.id, url: res.url });
        }).catch(function(){
          finish(null);
        });
      } else {
        finish(null);
      }
    };
  }

  function bootstrapMessage(result){
    if (!result) return "저장된 기록을 확인하지 못했어요. 새로고침해 주세요.";
    if (result.state === "LOCAL_OWNER_MISMATCH") return "이 기기에 다른 계정으로 저장한 기록이 있어요.";
    if (result.state === "CONFLICT") return "이 기기의 기록과 저장된 기록이 달라 확인이 필요합니다.";
    if (result.state === "INVALID_CLOUD_STATE") return "저장된 기록을 안전하게 확인하지 못했습니다.";
    return "저장된 기록을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.";
  }

  function readDiagnosticLocalOwner(currentUserId){
    var raw = window.localStorage.getItem("booktokki:local-owner:v1");
    if (raw == null) return { state:"MISSING", userId:null };
    try {
      var owner = JSON.parse(raw);
      if (!owner || owner.version !== 1 || typeof owner.userId !== "string" || !owner.userId){
        return { state:"INVALID", userId:null };
      }
      return { state:owner.userId === currentUserId ? "MATCH" : "MISMATCH", userId:owner.userId };
    } catch (_error){
      return { state:"INVALID", userId:null };
    }
  }

  function isLegacyRecoveryStandardJournalEligible(status){
    return status === "NONE" || status === "COMPLETE";
  }

  function readDiagnosticJournalStatus(userId){
    if (!userId) return "NONE";
    var raw = window.localStorage.getItem("booktokki:migration:v1:" + userId);
    if (raw == null) return "NONE";
    try {
      var journal = JSON.parse(raw);
      if (!journal || journal.version !== 1 || journal.userId !== userId) return "INVALID";
      if (journal.status === "complete") return "COMPLETE";
      if (journal.status === "in_progress") return "IN_PROGRESS";
      return "INVALID";
    } catch (_error){
      return "INVALID";
    }
  }

  var pendingRecoverySnapshots=null, pendingRecoveryBackup=null;
  function initLegacyRecoveryFlow(){
    var candidateBtn=document.getElementById("ownerRecoveryCandidateBtn"), backupBtn=document.getElementById("ownerRecoveryBackupBtn"), file=document.getElementById("ownerRecoveryFile"), confirm=document.getElementById("ownerRecoveryConfirm"), executeBtn=document.getElementById("ownerRecoveryExecuteBtn");

        var owner=values[2]; if(owner && owner.state!=="MISSING") throw new Error("owner state");

    file.addEventListener("change",function(){ var selected=file.files && file.files[0]; if(!selected) return; var reader=new FileReader(); reader.onload=function(){ try { var payload=JSON.parse(reader.result); if(!pendingRecoverySnapshots || !pendingRecoveryBackup || payload.userId!==activeAuthUserId || payload.baselineCloudHash!==pendingRecoveryBackup.baselineCloudHash || payload.localManifestHash!==pendingRecoveryBackup.localManifestHash) throw new Error("backup"); window.BooktokkiLegacyRecovery.verifyBackupPayload(payload,activeAuthUserId).then(function(receipt){ if(!receipt) throw new Error("backup integrity"); pendingRecoveryBackup=payload; pendingRecoveryBackup.receipt=receipt; document.getElementById("ownerRecoveryConfirmLabel").hidden=false; recoveryStatus("백업 파일을 확인했습니다. 최종 확인 후 복구를 실행할 수 있어요."); }).catch(function(){ recoveryStatus("백업 파일을 확인할 수 없어요."); }); } catch(_e){ recoveryStatus("백업 파일을 확인할 수 없어요."); } }; reader.readAsText(selected); });
    confirm.addEventListener("change",function(){ executeBtn.hidden=!confirm.checked; });
    executeBtn.addEventListener("click",function(){ if(!pendingRecoveryBackup || !pendingRecoverySnapshots || !confirm.checked) return; executeBtn.disabled=true; recoveryStatus("복구 중..."); window.BooktokkiLegacyRecovery.execute({backupPayload:pendingRecoveryBackup,backupReceipt:pendingRecoveryBackup.receipt,standardJournalStatus:readDiagnosticJournalStatus(activeAuthUserId),ownerState:"MISSING",userId:activeAuthUserId,localSnapshot:pendingRecoverySnapshots.local,cloudSnapshot:pendingRecoverySnapshots.cloud,storage:window.localStorage,baselineSnapshot:pendingRecoverySnapshots.cloud,client:supabaseClient,readCloud:function(){return window.BooktokkiMigrationDryRun.readCloudMigrationSnapshot(supabaseClient,activeAuthUserId);}}).then(function(result){ if(!result.success) throw new Error("cloud append"); return window.BooktokkiLegacyRecovery.mergeCloudOnlyBooks({cloudSnapshot:result.cloudSnapshot,userId:activeAuthUserId,localSnapshot:pendingRecoverySnapshots.local,database:db}); }).then(function(){ return Promise.all([window.BooktokkiMigrationDryRun.readLocalMigrationSnapshot(db),window.BooktokkiMigrationDryRun.readCloudMigrationSnapshot(supabaseClient,activeAuthUserId)]); }).then(function(values){ return window.BooktokkiOwnerDiagnostics.compareSnapshots({localSnapshot:values[0],cloudSnapshot:values[1],userId:activeAuthUserId,ownerState:"MISSING"}).then(function(check){ if(check.state!=="SAFE_TO_ADOPT" || check.matchedBooks!==check.cloudBooks || check.matchedReadingLogs!==check.cloudReadingLogs || check.matchedBookNotes!==check.cloudBookNotes) throw new Error("final equality"); var completed=window.BooktokkiLegacyRecovery.completeJournal(window.localStorage,activeAuthUserId,true); if(!completed.completed) throw new Error("journal"); var owner=window.BooktokkiLegacyRecovery.finalizeOwner({userId:activeAuthUserId,ownerState:"MISSING",verifyFinal:function(){return {finalEquality:true,recoveryJournalStatus:"complete",standardJournalStatus:"complete"};},writeOwner:function(){return window.BooktokkiCloudBootstrap.writeLocalOwner(window.localStorage,activeAuthUserId);}}); if(!owner.written) throw new Error("owner"); return Promise.resolve(owner.write()).then(function(){ return window.BooktokkiCloudBootstrap.runSafeCloudBootstrap({client:supabaseClient,database:db,storage:window.localStorage,userId:activeAuthUserId}); }).then(function(result){ if(!result || result.state!=="SYNCED" || result.canStart!==true) throw new Error("bootstrap"); return result; }); }); }).then(function(){ recoveryStatus("복구 검증이 완료되었습니다. 새로고침 후 기록을 확인하세요."); }).catch(function(){ recoveryStatus("복구가 중단됐어요. 기존 기록은 삭제·덮어쓰지 않았지만 일부 복구 기록이 추가됐을 수 있어요. 검증 후 다시 시도할 수 있습니다."); }).finally(function(){executeBtn.disabled=false;}); });
  }

  function showOwnerMismatchRecovery(visible, result){
    document.getElementById("ownerMismatchRecovery").hidden = !visible;
    if (!visible){
      setRecoveryVisible(false);
      return;
    }
    var owner = readDiagnosticLocalOwner(activeAuthUserId);
    var missing = owner.state === "MISSING";
    document.getElementById("ownerGuardTitle").textContent = missing
      ? "이 기기에 이전에 저장한 기록이 있어요."
      : "이 기기에 다른 계정으로 저장한 기록이 있어요.";
    document.getElementById("ownerGuardDescription").textContent = missing
      ? "기록의 연결 정보를 확인할 수 없어 자동으로 불러오지 않았어요."
      : "기록이 섞이지 않도록 자동 연결하지 않았어요.";
    document.getElementById("ownerGuardAccountHint").hidden = missing;
    document.getElementById("ownerGuardLoginAction").hidden = missing;
    setRecoveryVisible(missing);
    if (missing) initLegacyRecoveryFlow();
  }

  function showReadyApp(userId){
    if (activeAuthUserId !== userId) return;
    appStarted = true;
    bootstrappedUserId = userId;
    showOwnerMismatchRecovery(false);
    document.getElementById("authGate").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("app").inert = false;
    renderAll();
  }

  function startApp(session){
    var userId = session && session.user && session.user.id;
    if (!userId) return Promise.reject(new Error("로그인 사용자를 확인할 수 없어요."));
    if (appStarted && bootstrappedUserId === userId){
      document.getElementById("authGate").hidden = true;
      document.getElementById("app").hidden = false;
      return Promise.resolve();
    }
    if (bootstrapStarted) return bootstrapPromise;
    if (appStarted && bootstrappedUserId !== userId){
      appStarted = false;
      state.books = {};
      if (db) db.close();
      db = null;
      storageReady = null;
    }

    bootstrapStarted = true;
    showOwnerMismatchRecovery(false);
    document.getElementById("authGate").hidden = false;
    document.getElementById("app").hidden = true;
    document.getElementById("kakaoLoginBtn").hidden = true;
    document.getElementById("authStatus").textContent = "읽던 기록을 불러오는 중...";

    bootstrapPromise = initDb().then(function(){
      initAssets();
      if (!window.BooktokkiCloudBootstrap) throw new Error("Cloud bootstrap module is unavailable");
      return window.BooktokkiCloudBootstrap.runSafeCloudBootstrap({
        client:supabaseClient,
        database:db,
        storage:window.localStorage,
        userId:userId,
        onStatus:function(){
          document.getElementById("authStatus").textContent = "읽던 기록을 불러오는 중...";
        }
      });
    }).then(function(result){
      window.BOOKTOKKI_LAST_BOOTSTRAP_RESULT = result;
      console.log("BOOKTOKKI_CLOUD_BOOTSTRAP", result);
      if (!result.canStart) throw Object.assign(new Error(bootstrapMessage(result)), { bootstrapResult:result });
      if (!window.BooktokkiCloudRepository) throw new Error("Cloud repository module is unavailable");
      cloudRepository = window.BooktokkiCloudRepository.create(supabaseClient);
      try {
        analyticsRepository = window.BooktokkiAnalyticsRepository
          ? window.BooktokkiAnalyticsRepository.create(supabaseClient)
          : null;
      } catch (analyticsError) {
        analyticsRepository = null;
        console.error("북토끼 analytics 초기화 실패", { code:analyticsError && analyticsError.code ? analyticsError.code : null });
      }
      return cloudRepository.loadSnapshot(userId).then(loadLocalState).then(function(){ showReadyApp(userId); });
    }).catch(function(error){
      console.error("북토끼 Cloud bootstrap 실패", error && error.bootstrapResult ? error.bootstrapResult : error);
      if (activeAuthUserId !== userId) return;
      document.getElementById("app").hidden = true;
      document.getElementById("authGate").hidden = false;
      document.getElementById("kakaoLoginBtn").hidden = true;
      var ownerMismatch = error && error.bootstrapResult && error.bootstrapResult.state === "LOCAL_OWNER_MISMATCH";
      showOwnerMismatchRecovery(ownerMismatch, error && error.bootstrapResult ? error.bootstrapResult : null);
      document.getElementById("authStatus").textContent = ownerMismatch ? "" : (error.message || "저장된 기록을 불러오지 못했어요.");
    }).finally(function(){
      bootstrapStarted = false;
      bootstrapPromise = null;
    });
    return bootstrapPromise;
  }

  /* MY repositories only wrap the shared Supabase client, so they live for
     the authenticated session: showSignedOut drops them and every return to
     an authenticated session (including re-login without a reload) restores
     them here, without touching bootstrap or IndexedDB. */
  function ensureAccountRepositories(){
    if (!supabaseClient || (profileRepository && feedbackRepository)) return;
    try {
      profileRepository = window.BooktokkiProfileRepository.create(supabaseClient);
      feedbackRepository = window.BooktokkiFeedbackRepository.create(supabaseClient);
    } catch (repositoryError) {
      profileRepository = null;
      feedbackRepository = null;
      console.error("북토끼 MY 연결 초기화 실패", { code:repositoryError && repositoryError.code ? repositoryError.code : null });
    }
  }

  function showAuthenticated(session){
    cleanAuthRedirectUrl();
    activeAuthUserId = session && session.user ? session.user.id : null;
    activeAuthUser = session && session.user ? session.user : null;
    ensureAccountRepositories();
    startApp(session);
  }

  function showSignedOut(message){
    activeAuthUserId = null;
    activeAuthUser = null;
    appStarted = false;
    bootstrappedUserId = null;
    cloudRepository = null;
    analyticsRepository = null;
    profileRepository = null;
    feedbackRepository = null;
    cloudMutationQueues = {};
    pendingBookCreates = {};
    state.books = {};
    state.feedbackDraft = "";
    state.feedbackStatus = null;
    state.feedbackSubmitting = false;
    if (db) db.close();
    db = null;
    storageReady = null;
    cleanAuthRedirectUrl();
    showOwnerMismatchRecovery(false);
    document.getElementById("app").hidden = true;
    document.getElementById("authGate").hidden = false;
    document.getElementById("kakaoLoginBtn").hidden = false;
    document.getElementById("kakaoLoginBtn").disabled = !supabaseClient;
    document.getElementById("authStatus").textContent = message || "";
  }

  function initAuth(){
    var config = window.BOOKTOKKI_AUTH_CONFIG || {};
    var library = window.supabase;
    if (!library || !library.createClient){
      showSignedOut("로그인 연결을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
      return;
    }
    if (!config.supabaseUrl || !config.supabaseAnonKey){
      showSignedOut("Supabase 공개 설정값을 입력해 주세요.");
      return;
    }

    supabaseClient = library.createClient(config.supabaseUrl, config.supabaseAnonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    supabaseClient.auth.onAuthStateChange(function(_event, session){
      if (session) showAuthenticated(session);
      else showSignedOut("");
    });

    supabaseClient.auth.getSession().then(function(result){
      if (result.error){
        showSignedOut("로그인 상태를 확인하지 못했어요. 다시 시도해 주세요.");
        return;
      }
      if (result.data.session) showAuthenticated(result.data.session);
      else showSignedOut("");
    });
  }

  document.getElementById("kakaoLoginBtn").addEventListener("click", function(){
    if (!supabaseClient) return;
    var button = this;
    button.disabled = true;
    document.getElementById("authStatus").textContent = "카카오로 이동하고 있어요.";
    supabaseClient.auth.signInWithOAuth({
      provider: "kakao",
      options: { redirectTo: authRedirectUrl() }
    }).then(function(result){
      if (result.error){
        button.disabled = false;
        document.getElementById("authStatus").textContent = "로그인을 시작하지 못했어요. 다시 시도해 주세요.";
      }
    });
  });

  /* ---------------- boot ---------------- */
  initAuth();

  /* Catch the day rolling over to the next date while the page stays
     open, so the bunny resets to "오늘 기록 없음" without a reload. */
  var lastKnownDay = todayStr();
  setInterval(function(){
    var t = todayStr();
    if (t !== lastKnownDay){
      lastKnownDay = t;
      if (appStarted) renderAll();
    }
  }, 60000);
})();
</script>
